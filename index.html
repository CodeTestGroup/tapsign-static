<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .status-banner {
      max-width: 680px;
      margin: 4rem auto;
      padding: 2rem 2.5rem;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #f59e0b; /* Amber status indicator */
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #fef3c7;
      color: #b45309;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #f59e0b;
      border-radius: 50%;
    }

    .status-banner h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 0.75rem 0;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .status-banner p {
      font-size: 1rem;
      color: #475569;
      margin: 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="status-banner">
    <div class="status-badge">
      <span class="status-dot"></span>
      System Status
    </div>
    <h1>Temporary Infrastructure Maintenance</h1>
    <p>Following recent internal software disruptions, select infrastructure services are temporarily paused or undergoing updates. We are actively working to restore full service shortly.</p>
  </div>

</body>
</html>
