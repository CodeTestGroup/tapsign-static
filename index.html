<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      background-color: #090d16;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .maintenance-box {
      max-width: 600px;
      padding: 2.5rem;
      margin: 1rem;
      background: linear-gradient(145deg, #111827, #0f172a);
      border: 1px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: left;
    }

    .pulse-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #38bdf8;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 0 rgba(56, 189, 248, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .status-label {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
    }

    .maintenance-box h1 {
      color: #f8fafc;
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .maintenance-box p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.65;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="maintenance-box">
    <div class="status-label">
      <span class="pulse-indicator"></span>
      Service Notice
    </div>
    <h1>We’re updating our infrastructure.</h1>
    <p>Due to recent internal software outages, we have temporarily modified or disabled parts of our internal systems. We expect to be back online shortly.</p><br>
    <p>Sorry for any inconvenience this may of caused</p>
  </div>

</body>
</html>
